[project]
name = "atb-rl"
version = "0.1.0"
description = "RL training pipeline for Algorithm Test Bed"
requires-python = ">=3.11"

dependencies = [
    "stable-baselines3>=2.3.0",
    "sb3-contrib>=2.3.0",
    "gymnasium>=0.29.0",
    "torch>=2.3.0",
    "optuna>=3.6.0",
    "optuna-integration>=3.6.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "h5py>=3.11.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "tensorboard>=2.16.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pyright>=1.1",
    "pre-commit>=4.0",
]

[project.scripts]
atb-train   = "training.train:train"
atb-tune    = "training.tune:app"
atb-export  = "network.export:app"
atb-monitor = "monitoring.live_monitor:app"
atb-plot    = "monitoring.plot_run:app"
atb-stats   = "monitoring.stats_reader:app"
atb-trace   = "monitoring.trace_recorder:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ── Lint (ruff) — pyright is configured in /pyrightconfig.json; both run via
# checker.bash and the pre-commit hook. ──────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", "src/atb_rl.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E402",   # module-import-not-at-top: HDF5_USE_FILE_LOCKING must precede h5py
    "B008",   # function-call-in-default-argument: standard typer.Option/Argument pattern
    "RUF001", # ambiguous unicode: γ, ×, — et al. are deliberate in strings
    "RUF002", # ... in docstrings
    "RUF003", # ... in comments
]