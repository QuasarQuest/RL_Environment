[project]
name = "atb-rl"
version = "0.1.0"
description = "RL training pipeline for Algorithm Test Bed"
requires-python = ">=3.11"

dependencies = [
    "stable-baselines3>=2.3.0",
    "sb3-contrib>=2.3.0",
    "gymnasium>=0.29.0",
    "torch>=2.3.0",
    "optuna>=3.6.0",
    "optuna-integration>=3.6.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "h5py>=3.11.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotext>=5.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "raylib>=5.0.0",
]

[project.scripts]
atb-train   = "training.train:train"
atb-tune    = "training.tune:app"
atb-export  = "network.export:app"
atb-monitor = "monitoring.live_monitor:app"
atb-plot    = "monitoring.plot_run:app"
atb-stats   = "monitoring.stats_reader:app"
atb-trace   = "monitoring.trace_recorder:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]