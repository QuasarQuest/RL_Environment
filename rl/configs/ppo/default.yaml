# configs/ppo/default.yaml
# @package ppo
#
# PPO Hyperparameters — GTX 1650 Ti (4 GB VRAM), OBS_TOTAL=9629
# Slim architecture v2: ~1.47M params total (was 13.9M, 9.1× reduction)
#
# VRAM budget (slim, 48 envs):
#   Rollout buffer : 48 × 128 steps × 9629 floats × 4 bytes ≈ 236 MB
#   Policy + Adam  : ~10 MB   (was ~30 MB)
#   Activations    : ~60 MB   (was ~250 MB)
#   ─────────────────────────────────────────────────────────────────
#   Total          : ~306 MB  ✓  (was ~1.2 GB)

# ── Rollout ───────────────────────────────────────────────────────────────────
n_steps: 256

batch_size: 2048

n_epochs: 4   # fewer epochs OK — target_kl=0.02 still terminates early

# ── Discount & Advantage ──────────────────────────────────────────────────────
gamma:      0.99
gae_lambda: 0.95

# ── Clipping ──────────────────────────────────────────────────────────────────
clip_range:       0.2
clip_range_final: 0.2

# ── Entropy ───────────────────────────────────────────────────────────────────
# 11-action space: 0.01 starting ent_coef is sufficient.
ent_coef:       0.01
ent_coef_final: 0.001

# ── Value Function ────────────────────────────────────────────────────────────
vf_coef: 0.5

# ── Gradient ──────────────────────────────────────────────────────────────────
max_grad_norm: 0.5

# ── Learning Rate ─────────────────────────────────────────────────────────────
learning_rate:       3.0e-4
learning_rate_final: 1.0e-4

# ── Early Stop ────────────────────────────────────────────────────────────────
target_kl: 0.02

# ── Network Architecture ──────────────────────────────────────────────────────
# Lean pi/vf heads — LSTM already provides rich temporal representation.
# Deep heads add cost without benefit for an 11-action discrete space.
net_arch_pi: [64]
net_arch_vf: [64]

# ── LSTM (recurrent_ppo only) ─────────────────────────────────────────────────
# 128 instead of 256.
# Hidden state ops scale with hidden²: 128 is ~4× cheaper per step than 256.
# 128 units is sufficient to track one enemy's last-seen position, HP trend,
# and movement pattern — the full temporal requirement through stage 6 self-play.
# (NetHack NLE, far more complex, uses 512; Griddly 1v1 converges with 64–128.)
lstm_hidden_size: 128
n_lstm_layers:    1