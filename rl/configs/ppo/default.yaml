# configs/ppo/default.yaml
# @package ppo
#
# PPO Hyperparameters — RTX 5090 Laptop (24 GB VRAM), OBS_TOTAL=8692.
# Slim architecture v2 (~1.47M params). On this GPU training is env-stepping-
# bound, not GPU-update-bound: 8x batch_size/4x n_steps left FPS unchanged
# (~8k), while raising n_envs 128->512 got ~+25% (sub-linear — rollout
# collection doesn't scale cleanly with env count). Tune n_envs first; only
# reach for batch_size/n_epochs once GPU util stops sitting idle between
# update bursts (check with rl/scripts/profile_training.py).

# ── Rollout ───────────────────────────────────────────────────────────────────
n_steps: 256

batch_size: 2048

n_epochs: 4   # fewer epochs OK — target_kl=0.02 still terminates early

# ── Discount & Advantage ──────────────────────────────────────────────────────
gamma:      0.99
gae_lambda: 0.95

# ── Clipping ──────────────────────────────────────────────────────────────────
clip_range:       0.2
clip_range_final: 0.2

# ── Entropy ───────────────────────────────────────────────────────────────────
# 13-action space: 0.01 starting ent_coef is sufficient.
ent_coef:       0.01
ent_coef_final: 0.001

# ── Value Function ────────────────────────────────────────────────────────────
vf_coef: 0.5

# ── Gradient ──────────────────────────────────────────────────────────────────
max_grad_norm: 0.5

# ── Learning Rate ─────────────────────────────────────────────────────────────
learning_rate:       3.0e-4
learning_rate_final: 1.0e-4

# ── Early Stop ────────────────────────────────────────────────────────────────
target_kl: 0.02

# ── Network Architecture ──────────────────────────────────────────────────────
# Lean pi/vf heads — deep heads add cost without benefit for a 13-action discrete
# space, and the gold rush is fully observable so no temporal memory is needed.
net_arch_pi: [64]
net_arch_vf: [64]