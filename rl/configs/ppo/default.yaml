# configs/ppo/default.yaml
# @package ppo
#
# PPO Hyperparameters — RTX 4070 Laptop (8 GB VRAM), OBS_TOTAL=8692.
# Slim architecture v2 (~1.47M params). Training is GPU-update-bound: raising
# n_envs does not raise FPS — tune n_epochs/batch_size instead.

# ── Rollout ───────────────────────────────────────────────────────────────────
n_steps: 256

batch_size: 2048

n_epochs: 4   # fewer epochs OK — target_kl=0.02 still terminates early

# ── Discount & Advantage ──────────────────────────────────────────────────────
gamma:      0.99
gae_lambda: 0.95

# ── Clipping ──────────────────────────────────────────────────────────────────
clip_range:       0.2
clip_range_final: 0.2

# ── Entropy ───────────────────────────────────────────────────────────────────
# 13-action space: 0.01 starting ent_coef is sufficient.
ent_coef:       0.01
ent_coef_final: 0.001

# ── Value Function ────────────────────────────────────────────────────────────
vf_coef: 0.5

# ── Gradient ──────────────────────────────────────────────────────────────────
max_grad_norm: 0.5

# ── Learning Rate ─────────────────────────────────────────────────────────────
learning_rate:       3.0e-4
learning_rate_final: 1.0e-4

# ── Early Stop ────────────────────────────────────────────────────────────────
target_kl: 0.02

# ── Network Architecture ──────────────────────────────────────────────────────
# Lean pi/vf heads — deep heads add cost without benefit for a 13-action discrete
# space, and the gold rush is fully observable so no temporal memory is needed.
net_arch_pi: [64]
net_arch_vf: [64]