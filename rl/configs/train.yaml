# @package _global_
# Base training configuration.
# Override individual groups via CLI:
#   atb-train ppo=aggressive env=stage2
#   atb-train ++train.total_timesteps=5000000

defaults:
  - ppo: default
  - env: stage1
  - _self_

train:
  run_name: run
  algo: ppo
  total_timesteps: 1_000_000
  checkpoint_freq: 50_000
  eval_freq: 250_000
  # FIX: increased from 3 to 20 — with high episode variance (std ~9 in
  # the first run) 3 episodes give an unreliable signal. 20 episodes keep
  # the eval overhead small (~4s per eval call) while producing a stable
  # mean that reflects actual policy quality.
  eval_episodes: 10
  device: auto

  # Output dirs (relative to project root: algorithm_test_bed/)
  models_dir: runs/models
  stats_dir: runs/stats
  tensorboard_dir: runs/tensorboard

hydra:
  job:
    env_set:
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  run:
    dir: ../runs/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ../runs/outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}