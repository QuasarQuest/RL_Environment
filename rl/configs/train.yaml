# @package _global_
# Base training configuration.
# Override individual groups via CLI:
#   atb-train ppo=aggressive env=stage2
#   atb-train ++train.total_timesteps=5000000

defaults:
  - ppo: default
  - env: stage1
  - _self_

train:
  run_name: run
  # MaskablePPO (feedforward) — gold rush is fully observable, so no LSTM.
  # Action masking forbids provably-useless actions (empty regions, base when
  # empty-handed); Wait is never masked. See sim/src/engine action_mask().
  algo: maskable_ppo
  # NOTE: with temporally-extended options (SimCore::step_option) one timestep is
  # one high-level DECISION (a full A* traversal), not one sim tick — so this goes
  # much further than the same count did under per-tick stepping.
  total_timesteps: 2_000_000
  checkpoint_freq: 50_000
  eval_freq: 250_000
  eval_episodes: 10
  device: auto
  # Regenerate plots every N env steps during training (0 = only at stage end).
  # Rendering runs in a non-blocking subprocess, so training never stalls on it.
  # Lower to e.g. 25_000 for more frequent refreshes.
  plot_freq: 100_000

hydra:
  job:
    env_set:
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,max_split_size_mb:128,garbage_collection_threshold:0.7,roundup_power2_divisions:16"
  run:
    # Run dir IS the training output dir — Hydra's .hydra/ config snapshot
    # lands here alongside checkpoints/, tensorboard/, eval_best/, etc.
    dir: ../runs/${train.run_name}_s${env.stage}_${now:%s}
  sweep:
    dir: ../runs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}