# @package env
# Stage 1: single agent, gold collection, small map.

stage: 1
n_envs: 32

seed: null
max_episode_steps: null        # match_duration_ticks in config.ron governs episode length

clip_reward: true
clip_reward_max: 100.0
reward_scale: 1.0

# obs is already scaled to [0,1]/[-1,1] in sim/src/engine/obs.rs; per-dim
# VecNormalize over sparse binary CNN planes injects scale noise — keep off.
normalize_obs: false
normalize_reward: true