[workspace]
members  = ["sim", "viewer"]
resolver = "2"

# ── Build profiles ────────────────────────────────────────────────────────────

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

# Fast-linking profile for iterative viewer runs. Inherits release's opt-level=3
# but swaps fat LTO + codegen-units=1 (a single-threaded ~15 min link on the Bevy
# binary) for thin LTO + parallel codegen — links in ~1-2 min with ~95-99% of the
# runtime perf, which is imperceptible for visualization. Use `--release` when you
# actually want the maximally-optimized build.
[profile.viewer-fast]
inherits      = "release"
lto           = "thin"
codegen-units = 16
