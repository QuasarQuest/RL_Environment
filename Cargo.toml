[package]
name = "algorithm_test_bed"
version = "0.1.0"
edition = "2021"

[lib]
name = "atb"
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy       = { version = "0.18.1", features = ["debug"] }
rand       = "0.10.1"
ron        = "0.12.1"
serde      = { version = "1.0.228", features = ["derive"] }
rustc-hash = "2.1.2"
pyo3       = { version = "0.28.3", features = ["extension-module"], optional = true }

[features]
headless = []
python   = ["headless", "dep:pyo3"]

# ── Build profiles ────────────────────────────────────────────────────────────

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true