[workspace]
members  = ["sim", "viewer"]
resolver = "2"

# ── Build profiles ────────────────────────────────────────────────────────────

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
